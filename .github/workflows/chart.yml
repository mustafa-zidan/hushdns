name: Helm chart

# Publishes charts/hushdns to ghcr.io/<owner>/charts/hushdns as an OCI artifact for
# version tags. The chart and app versions both come from the tag. CI lints
# the chart on every pull request.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          version: v4.3.1
      - name: Package and push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "$GITHUB_TOKEN" | helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          helm package charts/hushdns --version "$version" --app-version "$version" --destination "$RUNNER_TEMP"
          helm push "$RUNNER_TEMP/hushdns-$version.tgz" "oci://ghcr.io/$owner/charts"
